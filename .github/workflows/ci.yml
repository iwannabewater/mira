name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv lock --check
      - name: Sync the lock before building the project
        run: |
          uv sync --frozen --no-install-project
          uv sync --frozen --no-build-isolation
      - name: Verify matrix interpreter
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          actual="$(uv run --no-sync python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          test "$actual" = "$EXPECTED_PYTHON"
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - name: Type-check supported platforms
        run: |
          uv run --no-sync mypy --platform linux src
          uv run --no-sync mypy --platform darwin src
      - run: uv run --no-sync lint-imports
      - run: uv run --no-sync vulture src/mira
      - run: uv run --no-sync pytest -m "not smoke"

  distributed:
    name: Two-rank Gloo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
          python-version: "3.12"
      - name: Sync the lock before building the project
        run: |
          uv sync --frozen --no-install-project
          uv sync --frozen --no-build-isolation
      - run: uv run --no-sync pytest tests/distributed -m distributed --no-cov

  inference:
    name: Qwen3-VL-Embedding inference dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
          python-version: "3.12"
      - name: Install the audited inference tuple
        run: |
          uv sync --frozen --no-install-project --extra inference-qwen3-vl-embedding
          uv sync --frozen --no-build-isolation --extra inference-qwen3-vl-embedding
      - name: Verify imports and exact compatibility ranges
        run: |
          uv run --no-sync python -c "from transformers import AutoProcessor, Qwen3VLModel; from mira.integrations.qwen3_vl_embedding import require_compatible; assert require_compatible().compatible"
      - run: uv run --no-sync pytest tests/unit/test_qwen3_vl_embedding_inference.py tests/unit/test_inference_factory.py --no-cov

  package:
    name: Build and isolated wheel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --no-install-project
      - run: uv export --frozen --no-dev --no-emit-project --output-file /tmp/runtime.txt > /dev/null
      - name: Build distributions with the commit timestamp
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          uv build --no-build-isolation
      - run: uv venv --python 3.12 /tmp/mira-wheel-smoke
      - name: Install the locked runtime and exact wheel
        run: |
          uv pip install \
            --python /tmp/mira-wheel-smoke/bin/python \
            --require-hashes \
            --requirements /tmp/runtime.txt
          wheel="$(find dist -name 'mira_embed-*.whl' -type f -print -quit)"
          test -n "$wheel"
          uv pip install \
            --python /tmp/mira-wheel-smoke/bin/python \
            --no-deps \
            "$wheel"
      - run: uv pip check --python /tmp/mira-wheel-smoke/bin/python
      - run: /tmp/mira-wheel-smoke/bin/mira --help
      - run: /tmp/mira-wheel-smoke/bin/mira --version
      - name: Smoke every installed command surface
        run: |
          set -eu
          for command in inspect init-config validate-data benchmark doctor mine evaluate encode export train migrate-encoded; do
            /tmp/mira-wheel-smoke/bin/mira "$command" --help >/dev/null
          done
      - name: Generate and inspect an installed reference config
        run: |
          work="$(mktemp -d)"
          cd "$work"
          /tmp/mira-wheel-smoke/bin/mira init-config --output mira.yaml
          /tmp/mira-wheel-smoke/bin/mira inspect --config mira.yaml
      - run: /tmp/mira-wheel-smoke/bin/python -c "import mira; print(mira.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
          python-version: "3.12"
      - name: Sync the lock before building the project
        run: |
          uv sync --frozen --no-install-project
          uv sync --frozen --no-build-isolation
      - name: Audit every registry pin independent of platform markers
        run: make audit-lock
      - run: uv export --frozen --no-dev --no-emit-project --output-file /tmp/runtime.txt > /dev/null
      - run: uv run --no-sync pip-audit --strict --requirement /tmp/runtime.txt
      - run: uv export --frozen --all-groups --no-emit-project --output-file /tmp/dev.txt > /dev/null
      - run: uv run --no-sync pip-audit --strict --requirement /tmp/dev.txt
      - run: uv export --frozen --extra faiss --no-dev --no-emit-project --output-file /tmp/faiss.txt > /dev/null
      - run: uv run --no-sync pip-audit --strict --requirement /tmp/faiss.txt
      - run: uv export --frozen --extra inference-qwen3-vl-embedding --no-dev --no-emit-project --output-file /tmp/inference.txt > /dev/null
      - run: uv run --no-sync pip-audit --strict --requirement /tmp/inference.txt
